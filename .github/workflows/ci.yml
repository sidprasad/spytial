name: CI

on:
  pull_request:
    branches:
      - "**"
  push:
    branches:
      - main
      - master
  workflow_dispatch:  # enables the manual "Run workflow" button (for browser-e2e)

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      reify: ${{ steps.filter.outputs.reify }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Detect reconstruction-related changes
        if: github.event_name != 'workflow_dispatch'
        id: filter
        uses: dorny/paths-filter@v4
        with:
          # PRs use their actual base (including stacked PRs). For pushes,
          # compare against the same branch's state before the push.
          base: ${{ github.ref }}
          filters: |
            reify:
              - 'spytial/provider_system.py'
              - 'spytial/domain_relationalizers/**'
              - 'spytial/structured_input.py'
              - 'spytial/__init__.py'
              - 'spytial/annotations.py'
              - 'spytial/utils.py'
              - 'spytial/_source.py'
              - 'spytial/_spec_tables.py'
              - 'spytial/core_assets.py'
              - 'spytial/_vendor/**'
              - 'spytial/suggest/_eval.py'
              - 'spytial/suggest/_vendor/**'
              - 'test/test_reify*.py'
              - 'test/test_relation*.py'
              - 'test/test_datamodel_inspection.py'
              - 'test/test_inspection.py'
              - 'test/inspection.py'
              - 'test/conftest.py'
              - 'pyproject.toml'
              - 'setup.py'
              - 'setup.cfg'
              - 'requirements*.txt'
              - 'spytial/requirements.txt'
              - 'pytest.ini'
              - 'tox.ini'
              - '.github/workflows/ci.yml'
              - 'update-spytial-core.sh'

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # The conformance suite (test/test_conformance.py) and the tier-2 evaluator
      # tests skip themselves when there is no node runtime, which is right for a
      # plain `pip install` and wrong for CI: a skipped test is indistinguishable
      # from a passing one in a green run. Both drive vendored self-contained
      # bundles, so a node binary is the whole requirement -- no npm install.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"

      - name: Run tests
        run: |
          python -m pytest -m "not reify"

  # Reconstruction, the inspection oracle, and property-based evidence get a
  # separate check. The marker keeps the two jobs disjoint; plain pytest still
  # runs both suites locally.
  reify:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.reify == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # The reconstruction contract also crosses the vendored core evaluator.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"

      - name: Run reify and property-based tests
        run: |
          python -m pytest -m reify -ra

  # The generated files must be exactly what the vendored spytial-core manifest
  # produces. test_spec_tables.py already asserts this, but it skips itself when
  # the repo layout is missing, and a skipped test is indistinguishable from a
  # passing one in a green run. Regenerating and diffing cannot skip.
  generated-artifacts:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"

      - name: Regenerate everything derived from spytial-core
        run: |
          python3 scripts/generate_spec_tables.py
          python3 scripts/vendor_lock.py
          python3 scripts/generate_api_baseline.py

      - name: Fail if anything regenerated differently
        run: |
          if ! git diff --exit-code; then
            echo "::error::Generated files are stale. Run the three scripts in"
            echo "::error::scripts/ and commit the result. If test/api_baseline.json"
            echo "::error::changed, read what test_api_baseline.py says about whether"
            echo "::error::the change is additive or breaking before choosing a version."
            exit 1
          fi

  # Real-browser end-to-end for spytial.edit(). Opt-in: runs only on a manual
  # "Run workflow" (workflow_dispatch), never on PRs/pushes — it needs a browser
  # and the spytial-core CDN, kept out of the required PR checks.
  browser-e2e:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev,e2e]"
          python -m playwright install --with-deps chromium

      - name: Run browser e2e
        env:
          SPYTIAL_BROWSER_TESTS: "1"
        run: |
          python -m pytest test/test_edit_browser.py -v
